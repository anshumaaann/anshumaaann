name: GitHub Profile Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Profile Dashboard
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg

          user: anshumaaann

          token: ${{ secrets.METRICS_TOKEN }}

          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Large infographic layout
          config_display: large

          # Main profile information
          base: header,activity,community,repositories,metadata

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size,percentage
          plugin_languages_other: yes

          # Coding habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_languages_limit: 6

          # Recent activity
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_load: 300
          plugin_activity_days: 30
          plugin_activity_filter: issue,pr,release,fork,review,ref/create

          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          # Repositories
          plugin_repositories: yes
          plugin_repositories_pinned: 4

          # Stargazers
          plugin_stargazers: yes
          plugin_stargazers_charts: yes

          # Notable contributions
          plugin_notable: yes

          # Lines of code
          plugin_lines: yes
          plugin_lines_sections: base,files,additions,deletions

          # Recently starred
          plugin_stars: yes
          plugin_stars_limit: 4

          # Calendar
          plugin_calendar: yes

          # People / followers
          plugin_people: yes
          plugin_people_types: followers

          # Output
          output_action: commit

          committer_branch: main
          committer_message: "Update GitHub profile metrics"
          committer_username: github-actions[bot]
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com

          delay: 120

          plugins_errors_fatal: no
