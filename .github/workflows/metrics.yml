name: GitHub Profile Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ============================================================
      # PROFILE OVERVIEW
      # ============================================================

      - name: Generate Profile Overview
        uses: lowlighter/metrics@latest
        with:
          filename: profile.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: anshumaaann

          base: header,activity,community,repositories,metadata

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update profile overview"

          plugins_errors_fatal: no


      # ============================================================
      # GITHUB ACTIVITY
      # ============================================================

      - name: Generate Activity
        uses: lowlighter/metrics@latest
        with:
          filename: activity.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: anshumaaann

          base: ""

          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 30
          plugin_activity_filter: issue,pr,release,fork,review,ref/create

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update activity"

          plugins_errors_fatal: no


      # ============================================================
      # CODING HABITS
      # ============================================================

      - name: Generate Coding Habits
        uses: lowlighter/metrics@latest
        with:
          filename: habits.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: anshumaaann

          base: ""

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_languages_limit: 6

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update coding habits"

          plugins_errors_fatal: no


      # ============================================================
      # LANGUAGES
      # ============================================================

      - name: Generate Languages
        uses: lowlighter/metrics@latest
        with:
          filename: languages.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: anshumaaann

          base: ""

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size,percentage
          plugin_languages_other: yes

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update language statistics"

          plugins_errors_fatal: no


      # ============================================================
      # ISOMETRIC CONTRIBUTION CALENDAR
      # ============================================================

      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: anshumaaann

          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update contribution calendar"

          plugins_errors_fatal: no


      # ============================================================
      # ACHIEVEMENTS
      # ============================================================

      - name: Generate Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: anshumaaann

          base: ""

          plugin_achievements: yes

          plugin_achievements_display: compact

          plugin_achievements_threshold: X

          plugin_achievements_only: >-
            polyglot,
            stargazer,
            sponsor,
            deployer,
            member,
            maintainer,
            developer,
            scripter,
            packager,
            explorer,
            infographile,
            manager

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update achievements"

          plugins_errors_fatal: no
