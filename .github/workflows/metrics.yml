name: GitHub Profile Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  profile:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Profile Dashboard
        uses: lowlighter/metrics@latest
        with:
          filename: profile.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: anshumaaann

          # Large wide dashboard
          config_display: large

          # Main profile sections
          base: header,activity,community,repositories,metadata

          # -------------------------
          # CONTRIBUTION CALENDAR
          # -------------------------
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # -------------------------
          # LANGUAGES
          # -------------------------
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size,percentage
          plugin_languages_other: yes

          # -------------------------
          # CODING HABITS
          # -------------------------
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_languages_limit: 6

          # -------------------------
          # RECENT ACTIVITY
          # -------------------------
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 14
          plugin_activity_filter: issue,pr,release,fork,review,ref/create

          # -------------------------
          # ACHIEVEMENTS
          # -------------------------
          plugin_achievements: yes
          plugin_achievements_display: compact

          # -------------------------
          # STARS
          # -------------------------
          plugin_stargazers: yes

          # -------------------------
          # REPOSITORIES
          # -------------------------
          plugin_repositories: yes
          plugin_repositories_pinned: 4

          # -------------------------
          # COMMIT CALENDAR
          # -------------------------
          plugin_calendar: yes

          # -------------------------
          # LINES OF CODE
          # -------------------------
          plugin_lines: yes

          # -------------------------
          # RECENTLY STARRED
          # -------------------------
          plugin_stars: yes
          plugin_stars_limit: 4

          # -------------------------
          # NOTABLE CONTRIBUTIONS
          # -------------------------
          plugin_notable: yes

          # -------------------------
          # FOLLOWERS
          # -------------------------
          plugin_people: yes
          plugin_people_types: followers

          # -------------------------
          # OUTPUT
          # -------------------------
          output_action: commit
          committer_branch: main
          committer_message: "Update GitHub profile dashboard"
          committer_username: github-actions[bot]
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com

          delay: 120
          plugins_errors_fatal: no
