name: GitHub Profile Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ============================================================
      # PROFILE
      # ============================================================

      - name: Generate Profile
        uses: lowlighter/metrics@latest
        with:
          filename: profile.svg

          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: anshumaaann

          base: header,activity,community,repositories,metadata

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update profile metrics"

          plugins_errors_fatal: no

          delay: 120


      # ============================================================
      # LANGUAGES
      # ============================================================

      - name: Generate Languages
        uses: lowlighter/metrics@latest
        with:
          filename: languages.svg

          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: anshumaaann

          base: ""

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size,percentage
          plugin_languages_other: yes

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update language metrics"

          plugins_errors_fatal: no

          delay: 120


      # ============================================================
      # ISOMETRIC CONTRIBUTION CALENDAR
      # ============================================================

      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: isocalendar.svg

          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: anshumaaann

          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update contribution calendar"

          plugins_errors_fatal: no

          delay: 120


      # ============================================================
      # REPOSITORIES
      # ============================================================

      - name: Generate Repositories
        uses: lowlighter/metrics@latest
        with:
          filename: repositories.svg

          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: anshumaaann

          base: ""

          plugin_repositories: yes
          plugin_repositories_pinned: 4

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update repositories"

          plugins_errors_fatal: no

          delay: 120


      # ============================================================
      # STARGAZERS
      # ============================================================

      - name: Generate Stargazers
        uses: lowlighter/metrics@latest
        with:
          filename: stargazers.svg

          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: anshumaaann

          base: ""

          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_days: 0

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update stargazers"

          plugins_errors_fatal: no

          delay: 120


      # ============================================================
      # CALENDAR
      # ============================================================

      - name: Generate Contribution Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: calendar.svg

          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: anshumaaann

          base: ""

          plugin_calendar: yes

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update contribution calendar"

          plugins_errors_fatal: no

          delay: 120


      # ============================================================
      # NOTABLE CONTRIBUTIONS
      # ============================================================

      - name: Generate Notable Contributions
        uses: lowlighter/metrics@latest
        with:
          filename: notable.svg

          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: anshumaaann

          base: ""

          plugin_notable: yes

          config_timezone: Asia/Kolkata

          output_action: commit

          committer_branch: main
          committer_message: "Update notable contributions"

          plugins_errors_fatal: no

          delay: 120
